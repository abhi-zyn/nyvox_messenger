name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: flutter create --org com.nyvox --platforms android .

      - name: Restore Nyvox logo
        run: |
          mkdir -p assets
          cat assets/logo_parts/part_* > assets/logo.b64
          base64 -d assets/logo.b64 > assets/logo.png
          file assets/logo.png

      - name: Enable screenshot and screen-recording protection
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/kotlin -name MainActivity.kt | head -n 1)
          sed -i 's|import io.flutter.embedding.android.FlutterActivity|import io.flutter.embedding.android.FlutterActivity\nimport android.os.Bundle\nimport android.view.WindowManager|' "$MAIN_ACTIVITY"
          sed -i 's|^}$|    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)\n    }\n}|' "$MAIN_ACTIVITY"

      - name: Enable core library desugaring
        run: |
          GRADLE=android/app/build.gradle.kts
          sed -i 's|    compileOptions {|    compileOptions {\n        isCoreLibraryDesugaringEnabled = true|' "$GRADLE"
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$GRADLE"

      - name: Force compileSdk 36 for app and plugins
        run: |
          APP_GRADLE=android/app/build.gradle.kts
          sed -i 's|compileSdk = flutter.compileSdkVersion|compileSdk = 36|' "$APP_GRADLE"
          ROOT_GRADLE=android/build.gradle.kts
          printf 'subprojects {\n    val proj = this\n    val forceCompileSdk = {\n        val androidExtension = proj.extensions.findByName("android")\n        if (androidExtension != null) {\n            try {\n                val method = androidExtension.javaClass.getMethod("compileSdkVersion", Integer.TYPE)\n                method.invoke(androidExtension, 36)\n            } catch (e: Exception) {\n                proj.logger.lifecycle("Skipped compileSdk override for: " + proj.name)\n            }\n        }\n    }\n    if (proj.state.executed) {\n        forceCompileSdk()\n    } else {\n        proj.afterEvaluate { forceCompileSdk() }\n    }\n}\n\n' > /tmp/compile_sdk_override.kts
          cat /tmp/compile_sdk_override.kts "$ROOT_GRADLE" > /tmp/root_build.gradle.kts
          mv /tmp/root_build.gradle.kts "$ROOT_GRADLE"

      - name: Add Android permissions and deep link
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>|' "$MANIFEST"
          sed -i 's|</activity>|            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="nyvox" android:host="u" />\n            </intent-filter>\n        </activity>|' "$MANIFEST"

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # Signs every release with the SAME key, so users can update in place.
      # Without this, each CI run uses a throwaway debug key and updates fail.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Add it before tagging a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          APP_GRADLE=android/app/build.gradle.kts
          python3 - "$APP_GRADLE" <<'PY'
          import sys, re
          path = sys.argv[1]
          src = open(path).read()
          header = '''import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties().apply {
              val f = rootProject.file("key.properties")
              if (f.exists()) load(FileInputStream(f))
          }

          '''
          src = header + src
          signing = '''    signingConfigs {
                  create("release") {
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }

          '''
          src = re.sub(r'(\n    buildTypes \{)', '\n' + signing + r'\1', src, count=1)
          src = src.replace('signingConfig = signingConfigs.getByName("debug")',
                            'signingConfig = signingConfigs.getByName("release")')
          open(path, 'w').write(src)
          PY
          cat "$APP_GRADLE"

      - name: Build signed release APKs
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Rename and checksum artifacts
        id: package
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cd build/app/outputs/flutter-apk
          for f in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk app-release.apk; do
            [ -f "$f" ] || continue
            case "$f" in
              app-release.apk) OUT="nyvox-$TAG-universal.apk" ;;
              *) ABI=$(echo "$f" | sed 's/app-\(.*\)-release.apk/\1/'); OUT="nyvox-$TAG-$ABI.apk" ;;
            esac
            cp "$f" "$GITHUB_WORKSPACE/dist/$OUT"
          done
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: Nyvox ${{ steps.package.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            **Nyvox ${{ steps.package.outputs.tag }}** — a product by Zenvx Team.

            ### Install
            Download `nyvox-${{ steps.package.outputs.tag }}-arm64-v8a.apk` for most modern phones
            (use the `universal` build if you are unsure), then allow install from unknown sources.
            Requires Android 8.0 or newer.

            ### Verify your download
            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

            ### Privacy
            No phone number, no email, no analytics. Messages are end-to-end encrypted with
            X25519 + AES-256-GCM on your device; the server only ever stores ciphertext.
