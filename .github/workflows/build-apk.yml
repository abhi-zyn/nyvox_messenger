name: Build Android APK

# Runs on every push to main, and manually via Actions → "Build Android APK" → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only contains lib/ + pubspec.yaml; this generates the
      # android/ platform scaffold needed to build (does not touch lib/).
      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name=nyvox

      # The logo PNG is stored as base64 (the API used to push this repo is
      # text-only); decode it before use.
      - name: Decode app logo asset
        run: base64 -di assets/nyvox_logo.png.b64 > assets/nyvox_logo.png

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons from the logo
        run: dart run flutter_launcher_icons

      # Block screenshots & screen recording (and app-switcher previews).
      - name: Enable FLAG_SECURE (no screenshots)
        run: |
          MAIN=android/app/src/main/kotlin/com/example/nyvox/MainActivity.kt
          sed -i 's|import io.flutter.embedding.android.FlutterActivity|import android.os.Bundle\nimport android.view.WindowManager\nimport io.flutter.embedding.android.FlutterActivity|' "$MAIN"
          sed -i 's|class MainActivity : FlutterActivity()|class MainActivity : FlutterActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)\n    }\n}|' "$MAIN"
          cat "$MAIN"

      # Allow posting notifications on Android 13+ (flutter create doesn't
      # include it by default).
      - name: Add notification permission
        run: sed -i 's|    <application|    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      # Never block the build on lint warnings.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # Supabase credentials are baked in at build time via --dart-define.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="https://vodttlhalrzqpsmowpaz.supabase.co" \
            --dart-define=SUPABASE_ANON_KEY="sb_publishable_YSWHXWMFdnFjbqoXBnfoyQ_i041nuvP"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyvox-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
