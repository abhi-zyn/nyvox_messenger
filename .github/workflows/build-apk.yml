name: Build Android APK

# Runs on every push to main, and manually via Actions → "Build Android APK" → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only contains lib/ + pubspec.yaml; this generates the
      # android/ platform scaffold needed to build (does not touch lib/).
      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name=nyvox

      - name: Install dependencies
        run: flutter pub get

      # Never block the build on lint warnings.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # Supabase credentials are baked in at build time via --dart-define.
      # The publishable key is Supabase's client-side key (safe to ship in the
      # app); data access is enforced by Row Level Security. To rotate, edit
      # these two lines or move the values into GitHub Secrets.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="https://vodttlhalrzqpsmowpaz.supabase.co" \
            --dart-define=SUPABASE_ANON_KEY="sb_publishable_YSWHXWMFdnFjbqoXBnfoyQ_i041nuvP"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyvox-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
