name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (e.g. v0.1.0). Leave empty to only upload an artifact.'
        required: false
        default: ''

# Needed so the workflow can publish a GitHub Release with the APK attached.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: flutter create --org com.nyvox --platforms android .

      - name: Restore Nyvox logo
        run: |
          mkdir -p assets
          cat assets/logo_parts/part_* > assets/logo.b64
          base64 -d assets/logo.b64 > assets/logo.png
          file assets/logo.png

      - name: Enable screenshot and screen-recording protection
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/kotlin -name MainActivity.kt | head -n 1)
          echo "MainActivity: $MAIN_ACTIVITY"
          sed -i 's|import io.flutter.embedding.android.FlutterActivity|import io.flutter.embedding.android.FlutterActivity\nimport android.os.Bundle\nimport android.view.WindowManager|' "$MAIN_ACTIVITY"
          sed -i 's|^}$|    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)\n    }\n}|' "$MAIN_ACTIVITY"
          cat "$MAIN_ACTIVITY"

      - name: Enable core library desugaring
        run: |
          GRADLE=android/app/build.gradle.kts
          sed -i 's|    compileOptions {|    compileOptions {\n        isCoreLibraryDesugaringEnabled = true|' "$GRADLE"
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$GRADLE"
          cat "$GRADLE"

      - name: Force compileSdk 36 for app and plugins
        run: |
          APP_GRADLE=android/app/build.gradle.kts
          sed -i 's|compileSdk = flutter.compileSdkVersion|compileSdk = 36|' "$APP_GRADLE"
          grep -n 'compileSdk' "$APP_GRADLE"
          ROOT_GRADLE=android/build.gradle.kts
          printf '// Force every Android module to compile against SDK 36. This must be\n// registered before any subproject is evaluated, so it is prepended ahead of\n// the generated evaluationDependsOn block. file_picker pins compileSdk 34\n// while its own dependencies require 36, breaking checkReleaseAarMetadata.\nsubprojects {\n    val proj = this\n    val forceCompileSdk = {\n        val androidExtension = proj.extensions.findByName("android")\n        if (androidExtension != null) {\n            try {\n                val method = androidExtension.javaClass.getMethod("compileSdkVersion", Integer.TYPE)\n                method.invoke(androidExtension, 36)\n                proj.logger.lifecycle("Forced compileSdk 36 for module: " + proj.name)\n            } catch (e: Exception) {\n                proj.logger.lifecycle("Skipped compileSdk override for: " + proj.name)\n            }\n        }\n    }\n    if (proj.state.executed) {\n        forceCompileSdk()\n    } else {\n        proj.afterEvaluate { forceCompileSdk() }\n    }\n}\n\n' > /tmp/compile_sdk_override.kts
          cat /tmp/compile_sdk_override.kts "$ROOT_GRADLE" > /tmp/root_build.gradle.kts
          mv /tmp/root_build.gradle.kts "$ROOT_GRADLE"
          cat "$ROOT_GRADLE"

      - name: Add Android permissions and deep link
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>|' "$MANIFEST"
          sed -i 's|</activity>|            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="nyvox" android:host="u" />\n            </intent-filter>\n        </activity>|' "$MANIFEST"
          cat "$MANIFEST"

      - name: Verify the deep link made it into the manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="nyvox"' "$MANIFEST" || {
            echo "::error::nyvox:// intent filter missing from AndroidManifest.xml"
            exit 1
          }

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyvox-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Publishes a permanent download link. Runs for a pushed v* tag, or when
      # the manual run supplies a release_tag.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "nyvox-$TAG.apk"
          gh release create "$TAG" "nyvox-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nyvox $TAG" \
            --generate-notes \
            || gh release upload "$TAG" "nyvox-$TAG.apk" --repo "$GITHUB_REPOSITORY" --clobber
