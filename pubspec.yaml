name: nyvox
description: A privacy-first, end-to-end encrypted messenger built with Flutter and Supabase.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.0

  # State management
  flutter_riverpod: ^2.5.1

  # Crypto: X25519 key exchange + AES-GCM authenticated encryption
  cryptography: ^2.7.0
  bip39: ^1.0.6            # recovery phrase (mnemonic) generation
  convert: ^3.1.1          # hex encode/decode

  # Secure on-device key storage (Keychain / EncryptedSharedPreferences)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Contact sharing
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  image_picker: ^1.1.2     # pick images from gallery
  share_plus: ^11.0.0      # share Account ID as custom text
  image: ^4.2.0            # on-device image compression (avatars, chat photos)

  # UI helpers
  intl: ^0.19.0
  timeago: ^3.7.0

  # Local notifications (privacy-safe: never contains message content)
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/nyvox_logo.png

# Generated in CI by `dart run flutter_launcher_icons` (see workflow).
# The source PNG is stored as base64 parts and reassembled by CI.
# Android only — CI generates just the android/ scaffold, so enabling iOS
# here crashes the generator (no ios/ folder exists).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/nyvox_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/nyvox_logo.png"
