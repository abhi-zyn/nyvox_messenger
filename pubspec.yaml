name: nyvox
description: Nyvox — end-to-end encrypted, anonymous messaging.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.4
  cryptography: ^2.7.0
  bip39: ^1.0.6
  hex: ^0.2.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  image: ^4.5.2
  crypto: ^3.0.6
  uuid: ^4.5.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  share_plus: ^11.0.0
  flutter_local_notifications: ^19.0.0
  file_picker: ^8.1.2
  record: ^6.0.0
  audioplayers: ^6.1.0
  open_filex: ^4.6.0
  app_links: ^6.3.3
  path_provider: ^2.1.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: 'assets/logo.png'
  adaptive_icon_background: '#0B0E11'
  adaptive_icon_foreground: 'assets/logo.png'
